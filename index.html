<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPIDER SYSTEM — Sport, Nutrition, Budget & Courses</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a12;
    --panel:#111119;
    --line:#26233a;
    --red:#e2231a;
    --blue:#1e6fff;
    --text:#f2f0f2;
    --muted:#8b87a3;
    --pixel:'Press Start 2P','Consolas',monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--pixel);}
  body{display:flex;flex-direction:column;height:100vh;overflow:hidden;}

  .hub-head{
    padding:10px 14px 8px;
    background:linear-gradient(180deg,#0d0d16,#0a0a12);
    border-bottom:2px solid var(--line);
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  }
  .hub-head .logo{font-size:12px;letter-spacing:.03em;color:var(--red);text-shadow:2px 2px 0 var(--line);}
  .hub-head .logo span{color:var(--blue);}
  .hub-head .sub{font-size:7px;color:var(--muted);letter-spacing:.03em;margin-top:4px;flex-basis:100%;}

  .sheet-tabs{
    display:flex;gap:2px;background:#050508;padding:8px 10px 0;border-bottom:2px solid var(--line);
    overflow-x:auto;
  }
  .sheet-tab{
    flex:0 0 auto;
    background:var(--panel);
    border:1px solid var(--line);
    border-bottom:none;
    color:var(--muted);
    font-family:var(--pixel);
    font-size:9px;
    letter-spacing:.02em;
    padding:11px 16px;
    border-radius:8px 8px 0 0;
    cursor:pointer;
    white-space:nowrap;
    transition:background .15s,color .15s;
    position:relative;
    top:2px;
  }
  .sheet-tab:hover{color:var(--text);}
  .sheet-tab.active{
    background:var(--bg);
    color:var(--text);
    border-color:var(--red);
    box-shadow:0 -2px 14px rgba(226,35,26,.25);
  }
  .sheet-tab.active[data-sheet="macro"]{ border-color:var(--blue); box-shadow:0 -2px 14px rgba(30,111,255,.3); }
  .sheet-tab.active[data-sheet="budget"]{ border-color:#f2b705; box-shadow:0 -2px 14px #f2b705A; }
  .sheet-tab.active[data-sheet="almanach"]{ border-color:#2fce6e; box-shadow:0 -2px 14px rgba(47,206,110,.3); }

  .sheet-tab .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--red);margin-right:8px;vertical-align:middle;}
  .sheet-tab[data-sheet="macro"] .dot{background:var(--blue);}
  .sheet-tab[data-sheet="budget"] .dot{background:#f2b705;}
  .sheet-tab[data-sheet="almanach"] .dot{background:#2fce6e;}

  .frames{flex:1;position:relative;min-height:0;}
  .frame-wrap{position:absolute;inset:0;display:none;}
  .frame-wrap.active{display:block;}
  .frame-wrap iframe{width:100%;height:100%;border:none;display:block;background:var(--bg);}
  .loading{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    color:var(--muted);font-size:9px;letter-spacing:.04em;background:var(--bg);
  }

  .sheet-strip{
    display:flex;gap:4px;padding:6px 10px;background:#050508;border-top:2px solid var(--line);
    overflow-x:auto;
  }
  .sheet-strip button{
    flex:0 0 auto;background:var(--panel);border:1px solid var(--line);color:var(--muted);
    font-family:var(--pixel);font-size:7.5px;padding:7px 12px;border-radius:5px;cursor:pointer;
  }
  .sheet-strip button.active{background:var(--red);color:#0a0a0f;border-color:var(--red);}
  .sheet-strip button[data-sheet="macro"].active{background:var(--blue);border-color:var(--blue);}
  .sheet-strip button[data-sheet="budget"].active{background:#f2b705;border-color:#f2b705;color:#f2b705T;}
  .sheet-strip button[data-sheet="almanach"].active{background:#2fce6e;border-color:#2fce6e;color:#06210f;}

  /* ============ ACCUEIL (HUB) ============ */
  #hub{
    flex:1;overflow-y:auto;border-top:3px solid #5a4210;
    background:radial-gradient(ellipse 70% 38% at 50% 0%,rgba(120,16,44,.38),transparent 70%),var(--bg);
    padding:clamp(28px,7vh,52px) 16px 40px;
  }
  #hub .hub-wrap{max-width:550px;margin:0 auto;}
  .hub-eyebrow{font-size:9px;letter-spacing:.18em;color:#ff2e63;text-align:center;}
  .hub-title{
    font-size:clamp(26px,7vw,38px);text-align:center;margin:18px 0 16px;color:#fff;letter-spacing:.04em;
    text-shadow:3px 3px 0 #b3123a;
  }
  .hub-lead{font-family:'Share Tech Mono',var(--pixel);font-size:15px;color:#a39fbd;text-align:center;margin:0 0 38px;}
  .app-card{
    --c:#ff2e63;
    display:flex;align-items:center;gap:22px;width:100%;margin:0 0 22px;padding:26px 22px;
    background:#0b0b15;border:3px solid var(--c);box-shadow:4px 4px 0 #000;
    color:var(--text);text-align:left;cursor:pointer;font:inherit;
    transition:transform .12s,box-shadow .12s;
  }
  .app-card:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 #000;}
  .app-card:active{transform:translate(2px,2px);box-shadow:2px 2px 0 #000;}
  .app-card:focus-visible{outline:3px solid #fff;outline-offset:4px;}
  .app-ico{flex:0 0 52px;font-size:38px;line-height:1;text-align:center;filter:saturate(1.1);}
  .app-txt{flex:1;min-width:0;display:block;}
  .app-name,.app-desc{display:block;}
  .app-name{font-family:var(--pixel);font-size:clamp(11px,3.2vw,14px);line-height:1.6;color:var(--c);margin:0 0 14px;}
  .app-desc{font-family:'Share Tech Mono',var(--pixel);font-size:13px;line-height:2;color:#a39fbd;margin:0;}
  .app-go{flex:0 0 auto;font-size:10px;color:#6d6a86;}
  .hub-foot{font-size:8px;letter-spacing:.14em;color:#33324a;text-align:center;margin-top:44px;}
  .back-btn{
    background:var(--panel);border:1px solid var(--line);color:var(--text);font-family:var(--pixel);
    font-size:8px;padding:8px 10px;border-radius:5px;cursor:pointer;
  }
  .back-btn:hover{border-color:var(--red);}
  .back-btn:focus-visible{outline:2px solid #fff;outline-offset:2px;}
  #viewer{display:none;flex:1;flex-direction:column;min-height:0;}
  body.in-app #viewer{display:flex;}
  body.in-app #hub{display:none;}
  @media (prefers-reduced-motion:reduce){.app-card{transition:none;}}
</style>
</head>
<body>

<main id="hub">
  <div class="hub-wrap">
    <div class="hub-eyebrow">▸ SYSTÈME UNIFIÉ</div>
    <h1 class="hub-title">MON HUB</h1>
    <p class="hub-lead">Choisis une application pour l'ouvrir.</p>

    <button class="app-card" style="--c:#ff2e63" data-open="sport">
      <span class="app-ico">🕷️</span>
      <span class="app-txt"><span class="app-name">SPIDER TRAINING<br>SYSTEM</span><span class="app-desc">Programme d'entraînement, circuit Tom Holland, tracker de mesures &amp; suivi d'objectifs</span></span>
      <span class="app-go">►</span>
    </button>

    <button class="app-card" style="--c:#4d9bff" data-open="macro">
      <span class="app-ico">🍽️</span>
      <span class="app-txt"><span class="app-name">MACRO TRACKER<br>NUTRITION</span><span class="app-desc">Calories, protéines &amp; macros — chaque plat, la journée et l'historique</span></span>
      <span class="app-go">►</span>
    </button>

    <button class="app-card" style="--c:#f2b705" data-open="budget">
      <span class="app-ico">💰</span>
      <span class="app-txt"><span class="app-name">MON CAHIER<br>DE COMPTES</span><span class="app-desc">Budget façon village — comptes, dépenses, rentrées &amp; virements jour/mois/année</span></span>
      <span class="app-go">►</span>
    </button>

    <button class="app-card" style="--c:#2fce6e" data-open="almanach">
      <span class="app-ico">🛒</span>
      <span class="app-txt"><span class="app-name">ALMANACH<br>COURSES &amp; REPAS</span><span class="app-desc">Courses &amp; repas de septembre à juin — saison, Saint-Étienne &amp; trajets Clermont</span></span>
      <span class="app-go">►</span>
    </button>

    <div class="hub-foot">4 APPS · 1 FICHIER</div>
  </div>
</main>

<div id="viewer">
  <div class="hub-head">
    <button class="back-btn" onclick="goHome()" aria-label="Retour à l'accueil">◀ ACCUEIL</button>
    <div class="logo" id="app-title"></div>
  </div>

  <div class="frames">
    <div class="frame-wrap active" id="wrap-sport">
      <div class="loading" id="loading-sport">Chargement…</div>
      <iframe id="iframe-sport" title="Sport Tracker"></iframe>
    </div>
    <div class="frame-wrap" id="wrap-macro">
      <div class="loading" id="loading-macro">Chargement…</div>
      <iframe id="iframe-macro" title="Macro Tracker"></iframe>
    </div>
    <div class="frame-wrap" id="wrap-budget">
      <div class="loading" id="loading-budget">Chargement…</div>
      <iframe id="iframe-budget" title="Budget"></iframe>
    </div>
    <div class="frame-wrap" id="wrap-almanach">
      <div class="loading" id="loading-almanach">Chargement…</div>
      <iframe id="iframe-almanach" title="Almanach Courses & Repas"></iframe>
    </div>
  </div>

</div><!-- /viewer -->

function b64DecodeUnicode(str){
  return decodeURIComponent(atob(str).split('').map(function(c){
    return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
  }).join(''));
}

const SRC = { sport: SPORT_B64, macro: MACRO_B64, budget: BUDGET_B64, almanach: ALMANACH_B64 };
const loaded = { sport: false, macro: false, budget: false, almanach: false };

function loadSheet(name){
  if(loaded[name]) return;
  const iframe = document.getElementById('iframe-'+name);
  const loading = document.getElementById('loading-'+name);
  iframe.addEventListener('load', ()=>{ if(loading) loading.style.display='none'; }, { once:true });
  iframe.srcdoc = b64DecodeUnicode(SRC[name]);
  loaded[name] = true;
}

function showSheet(name){
  document.querySelectorAll('.frame-wrap').forEach(el=>el.classList.remove('active'));
  document.getElementById('wrap-'+name).classList.add('active');

  const T = { sport:['SPIDER TRAINING SYSTEM','#ff2e63'], macro:['MACRO TRACKER NUTRITION','#4d9bff'], budget:['MON CAHIER DE COMPTES','#f2b705'], almanach:['ALMANACH COURSES & REPAS','#2fce6e'] };
  const t = document.getElementById('app-title');
  t.textContent = T[name][0]; t.style.color = T[name][1];

  loadSheet(name);
}


document.querySelectorAll('[data-open]').forEach(el=>{
  el.addEventListener('click', ()=>{
    document.body.classList.add('in-app');
    showSheet(el.dataset.open);
  });
});

function goHome(){
  document.body.classList.remove('in-app');
  document.getElementById('hub').scrollTop = 0;
}
</script>
